# Claude Code validation/review via the official action, routed through OpenRouter.
#
# To use it:
#   1. Copy this file to .github/workflows/claude-code.yml
#   2. Install the Claude GitHub App on the repository
#   3. Add a repository secret named OPENROUTER_API_KEY
#   4. Pick a model in claude_args below
#
# See docs/claude-code-github-actions.md for the full guide.

name: Claude Code Review (OpenRouter)

# Note: GitHub does not pass secrets to fork or Dependabot `pull_request` runs, so
# OPENROUTER_API_KEY is empty there and the job fails its auth check. Re-run after merge
# or use `pull_request_target` with a read-only checkout; see the guide's Troubleshooting.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            Review the changes on this pull request for correctness, security, and
            documentation consistency. Do not modify files. Report findings as a
            concise summary.
          claude_args: |
            --model anthropic/claude-haiku-5.5
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(npm test)"
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
