# Claude Code plugin testing in GitHub Actions.
#
# Layer 1 (every PR):  claude plugin validate - static, free, no model calls.
# Layer 2 (manual):    claude plugin eval    - real runs; needs ANTHROPIC_API_KEY
#                      (or gateway vars) and --trust-plugin for non-interactive use.
# Both layers share one job so checkout, Node, and the Claude Code install
# happen once; the eval step is skipped unless this is a dispatch run.
#
# To use it in your own repo:
#   1. Add an ANTHROPIC_API_KEY secret (or set ANTHROPIC_BASE_URL variable +
#      ANTHROPIC_AUTH_TOKEN secret to route through a gateway such as OpenRouter).
#      validate needs no secrets, eval does.
#   2. Open a pull request to exercise validate; run eval via workflow_dispatch.
#
# See docs/claude-plugin-testing.md for the full command surface and exit codes.

name: Claude Plugin CI

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - 'agents/**'
      - 'commands/**'
      - 'hooks/**'
      - '.mcp.json'
      - 'evals/**'
      - '.github/workflows/claude-plugin-ci.yml'
  workflow_dispatch:
    inputs:
      run_eval:
        description: 'Also run claude plugin eval'
        type: boolean
        default: false
      threshold:
        description: 'Eval score threshold (0..1)'
        type: string
        default: '0.8'
      model:
        description: 'Model under test (gateway model id if using a gateway)'
        type: string
        default: 'beam:cloud'
      judge_model:
        description: 'Judge model'
        type: string
        default: 'gpt-oss:120b'
      case:
        description: 'Optional single case name glob to debug (empty = all cases)'
        type: string
        default: ''
      runs:
        description: 'Optional runs per case, 1-10 (empty = case default)'
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: claude-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  # Only supersede stale PR runs. Never cancel an in-flight (paid) eval run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Show CLI version
        run: claude --version

      - name: Validate plugin
        run: |
          set -o pipefail
          claude plugin validate . --json | tee validate-report.json

      # A failed validate step stops the job, so eval only runs on a green validate.
      #
      # All dispatch inputs and secrets are passed through env, never interpolated
      # into the script, to avoid shell injection.
      #
      # Model selection lives here, not in a settings file: eval runs start in an
      # isolated temp home/config, so .claude/settings.json is never read.
      # CLAUDE_CODE_MAX_OUTPUT_TOKENS caps the max_tokens each request asks for;
      # gateways such as OpenRouter bill against it and answer 402 when it exceeds
      # the account's credits.
      - name: Run plugin eval
        if: github.event_name == 'workflow_dispatch' && inputs.run_eval
        env:
          ANTHROPIC_API_KEY: '' # ${{ secrets.ANTHROPIC_API_KEY }}
          GATEWAY_URL: ${{ vars.BASE_URL_FOR_CI }}
          GATEWAY_TOKEN: ${{ secrets.AUTH_TOKEN_FOR_CI }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '8192'
          EVAL_THRESHOLD: ${{ inputs.threshold }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
          EVAL_CASE: ${{ inputs.case }}
          EVAL_RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail

          # Empty values must be unset, not exported as empty strings.
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          # Prefer direct Anthropic credentials when both are present; only route
          # through a gateway when API-key auth is not configured.
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            [ -z "${GATEWAY_URL:-}" ]   || export ANTHROPIC_BASE_URL="$GATEWAY_URL"
            [ -z "${GATEWAY_TOKEN:-}" ] || export ANTHROPIC_AUTH_TOKEN="$GATEWAY_TOKEN"
          fi

          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::error::No credentials. Set ANTHROPIC_API_KEY, or ANTHROPIC_BASE_URL (variable) + ANTHROPIC_AUTH_TOKEN (secret)."
            exit 1
          fi

          threshold="${EVAL_THRESHOLD:-0.8}"
          if ! [[ "$threshold" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]]; then
            echo "::error::threshold must be a number between 0 and 1, got '$threshold'"
            exit 1
          fi

          if [ -n "${EVAL_RUNS:-}" ]; then
            if ! [[ "$EVAL_RUNS" =~ ^(10|[1-9])$ ]]; then
              echo "::error::runs must be an integer from 1 to 10, got '$EVAL_RUNS'"
              exit 1
            fi
          fi

          eval_args=(
            .
            --trust-plugin
            --json results.json
            --threshold "$threshold"
            --model "${EVAL_MODEL:-beam:cloud}"
            --judge-model "${EVAL_JUDGE_MODEL:-gpt-oss:120b}"
            --no-publish
            --ablation none
            --max-cost-usd 20
            --keep-temp
          )
          # --allow-real-servers is deliberately NOT passed: every MCP server is
          # mocked under evals/mocks/engineering-docs/. A new server in .mcp.json
          # needs a matching mock directory before it can be used in evals.
          if [ -n "${EVAL_CASE:-}" ]; then
            eval_args+=(--case "$EVAL_CASE")
          fi
          if [ -n "${EVAL_RUNS:-}" ]; then
            eval_args+=(--runs "$EVAL_RUNS")
          fi

          rc=0
          claude plugin eval "${eval_args[@]}" || rc=$?

          # Summarize the result before exiting so a failing score is still readable.
          if [ -f results.json ]; then
            model="${EVAL_MODEL:-beam:cloud}"
            judge="${EVAL_JUDGE_MODEL:-gpt-oss:120b}"
            suite_threshold="$threshold"
            overall_score="$(jq -r '.aggregates.overallScore // "unknown"' results.json 2>/dev/null || echo unknown)"
            cases_total="$(jq -r '.aggregates.casesTotal // 0' results.json 2>/dev/null || echo 0)"
            cases_passed="$(jq -r '.aggregates.casesPassed // 0' results.json 2>/dev/null || echo 0)"
            pass_rate="$(awk -v p="${cases_passed:-0}" -v t="${cases_total:-0}" 'BEGIN { if (t+0 > 0) printf "%.4g", p/t; else print "unknown" }')"
            {
              echo "### Claude Plugin Eval Summary"
              echo
              echo "- Model: \`$model\`"
              echo "- Judge: \`$judge\`"
              echo "- Threshold: \`$suite_threshold\`"
              echo "- Suite score: \`$overall_score\` ($cases_passed/$cases_total cases passed, pass rate \`$pass_rate\`)"
              echo
              echo "| Case | Score | Failed graders (runs) |"
              echo "|---|---|---|"
              jq -r '
                (.cases // [])[] |
                .name as $name |
                (.aggregates.score // 0) as $score |
                ([.arms.with[]?.graders[]?] // []) as $all |
                ([$all[].name] | unique) as $names |
                ([
                  $names[] | . as $g |
                  ([ $all[] | select(.name == $g and ((.passed // false) | not)) ] | length) as $fails |
                  ([ $all[] | select(.name == $g) ] | length) as $total |
                  if $fails > 0 then "\($g) (\($fails)/\($total))" else empty end
                ] | join(", ")) as $failed |
                "| \($name) | \($score) | \(if ($failed | length) == 0 then "none" else $failed end) |"
              ' results.json 2>/dev/null || true
            } >> "${GITHUB_STEP_SUMMARY:-/tmp/claude-plugin-ci-step-summary.md}"

            never_tools="$(jq -r '
              ([.cases[]?.arms?.with[]?.graders[]? | select(.name == "skill-fired")] | length) as $n |
              if $n == 0 then "false"
              elif (all(.cases[]?.arms?.with[]?.graders[]? | select(.name == "skill-fired"); ((.passed // false) | not))) then "true"
              else "false" end
            ' results.json 2>/dev/null)" || never_tools="false"
            if [ "$never_tools" = "true" ]; then
              echo "::error::The model never invoked the Skill tool in any run. This usually means the model or gateway does not support Anthropic-style tool use; scores are therefore not a measure of plugin quality. The 'ignores-unrelated-request' case passing is not meaningful in that situation."
            fi
          fi

          exit "$rc"

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: plugin-ci-reports
          path: |
            validate-report.json
            results.json
            evals/results/
            /tmp/claude-eval-*/out/trace.jsonl
          if-no-files-found: ignore
          retention-days: 14
