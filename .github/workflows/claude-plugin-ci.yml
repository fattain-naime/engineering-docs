# Claude Code plugin testing in GitHub Actions.
#
# Layer 1 (every PR):  claude plugin validate — static, free, no model calls.
# Layer 2 (manual):    claude plugin eval    — real runs; needs ANTHROPIC_API_KEY
#                      (or gateway vars) and --trust-plugin for non-interactive use.
# Both layers share one job so checkout, Node, and the Claude Code install
# happen once; the eval step is skipped unless this is a dispatch run.
#
# To use it in your own repo:
#   1. Add an ANTHROPIC_API_KEY secret (or set ANTHROPIC_BASE_URL +
#      ANTHROPIC_AUTH_TOKEN to route through a gateway such as OpenRouter) —
#      validate needs no secrets, eval does
#   2. Open a pull request to exercise validate; run eval via workflow_dispatch
#
# See docs/claude-plugin-testing.md for the full command surface and exit codes.

name: Claude Plugin CI

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - 'agents/**'
      - 'commands/**'
      - 'hooks/**'
      - '.mcp.json'
      - 'evals/**'
      - '.github/workflows/claude-plugin-ci.yml'
  workflow_dispatch:
    inputs:
      run_eval:
        description: 'Also run claude plugin eval'
        type: boolean
        default: false
      threshold:
        description: 'Eval score threshold (0..1)'
        type: string
        default: '0.8'

permissions:
  contents: read

concurrency:
  group: claude-plugin-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Show CLI version
        run: claude --version

      - name: Validate plugin
        run: claude plugin validate . --json > validate-report.json

      # Route through a gateway (e.g. OpenRouter) by setting base URL + token,
      # or provide a direct ANTHROPIC_API_KEY. Do not commit either value.
      # A failed validate step stops the job, so eval only runs on a green
      # validate.
      #
      # Model selection lives here, not in a settings file: eval runs start in
      # an isolated temp home/config, so .claude/settings.json is never read.
      # --model / --judge-model (or ANTHROPIC_MODEL in this step's env, which
      # the runs inherit) are the only levers. CLAUDE_CODE_MAX_OUTPUT_TOKENS
      # caps the max_tokens each request asks for — gateways such as OpenRouter
      # bill against it and answer 402 when it exceeds the account's credits.
      - name: Run plugin eval
        if: github.event_name == 'workflow_dispatch' && inputs.run_eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '132000'
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json results.json \
            --threshold "${{ inputs.threshold || '0.8' }}" \
            --model nvidia/nemotron-3-ultra-550b-a55b:free \
            --judge-model nvidia/nemotron-3-super-120b-a12b:free \
            --no-publish \
            --ablation none \
            --max-cost-usd 20

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-ci-reports
          path: |
            validate-report.json
            results.json
            evals/results/
