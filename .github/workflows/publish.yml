name: Publish Package

on:
  release:
    types:
      - published
  # Automated releases are created with GITHUB_TOKEN, whose events GitHub
  # suppresses, so validate.yml's release job dispatches this workflow instead.
  # It is dispatched (not called as a reusable workflow) on purpose: npm trusted
  # publishing matches the TOP-LEVEL workflow file, so publish.yml must be the
  # entry workflow of the run for the npmjs.com trusted publisher to accept it.
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish --provenance --access public
